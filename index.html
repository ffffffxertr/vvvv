<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة مواهب المدية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="btn-group-header">
        <button><i class="fa fa-bars"></i></button>
        <button><i class="fa fa-search"></i></button>
      </div>
      <div class="mainLogo">
        <img src="assets/images/medea.png" alt="شعار مواهب المدية" />
      </div>
    </header>

    <main>
      <div class="video-container">
        <video
          src="assets/images/4091694-hd_1920_1080_30fps.mp4"
          autoplay
          muted
          loop
          playsinline
        ></video>
        <!-- طبقة التدرج تغطي الحاوية بالكامل -->
        <div class="video-overlay"></div>
      </div>

      <div class="hero-content">
        <h1>منصة مواهب المدية</h1>
        <p>الحاضنة الأولى للإبداع والتميز</p>
        <div class="btns">
          <button class="button primary-btn">سجل الدخول</button>
          <button class="button">المواهب</button>
        </div>
      </div>
    </main>

    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
